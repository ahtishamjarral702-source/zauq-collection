<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zauq - Luxury Collection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        header { background-color: #1a1a1a; color: #d4af37; text-align: center; padding: 25px 15px; }
        header h1 { font-size: 32px; letter-spacing: 4px; font-weight: 700; }
        header p { font-size: 14px; color: #ccc; margin-top: 5px; letter-spacing: 1px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .product-card img { width: 100%; height: auto; display: block; object-fit: cover; }
        .details { padding: 20px; }
        .product-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; color: #222; }
        .price { font-size: 22px; color: #1a1a1a; font-weight: bold; margin-bottom: 12px; }
        .description { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
        .btn-order { display: block; width: 100%; background-color: #25D366; color: white; text-align: center; padding: 14px; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 16px; box-shadow: 0 4px 8px rgba(37, 211, 102, 0.2); }
    </style>
</head>
<body>

    <header>
        <h1>Z A U Q</h1>
        <p>Luxury Embroidered Collection</p>
    </header>

    <div class="container">
        <div class="product-card">
            <!-- image file name uploaded on github -->
            <img src="suit1.jpg" alt="Zauq Embroidered Suit">
            <div class="details">
                <div class="product-title">Black Embroidered 3-Piece Suit</div>
                <div class="price">PKR 3,500</div>
                <div class="description">
                    High quality embroidered shirt with matching trouser and dupatta. Premium fabric with detailed neck & sleeve embroidery.
                </div>
                
                <!-- WhatsApp order link with updated user phone number -->
                <a href="https://wa.me/923236120879?text=Hello!%20I%20want%20to%20order%20Zauq%20Black%20Embroidered%203-Piece%20Suit" class="btn-order">
                    Order via WhatsApp
                </a>
            </div>
        </div>
    </div>

</body>
</html>
